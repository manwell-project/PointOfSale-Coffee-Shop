<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <title>Scanner Barcode - DigiCaf</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../css/design-tokens.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/layout-system.css">
    
    <!-- Component CSS -->
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/top-navbar-simple.css?v=1769014084">
    
    <!-- Third-party -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .scanner-header {
            background: var(--bg-card);
            padding: 1rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: var(--bg-hover);
        }

        .scanner-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .scanner-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .reader-wrapper {
            width: 100%;
            max-width: 500px;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        #reader {
            width: 100%;
            min-height: 300px;
        }

        .scanner-status {
            text-align: center;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 500;
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .fallback-section {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
            box-sizing: border-box;
        }

        .fallback-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        #scanImageInput {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.9rem;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header class="scanner-header">
        <button class="btn-back" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="scanner-title">Scan Barcode Stok</h1>
    </header>

    <main class="scanner-container">
        
        <div class="reader-wrapper">
            <div id="reader"></div>
        </div>

        <div id="scannerStatus" class="scanner-status">
            <i class="fas fa-spinner fa-spin"></i> Menyiapkan kamera...
        </div>

        <div class="fallback-section">
            <p class="fallback-title">Kamera buram atau tidak berfungsi? Unggah foto barcode:</p>
            <input type="file" id="scanImageInput" accept="image/*">
        </div>

    </main>

    <script src="scanner.js"></script>
</body>
</html>
